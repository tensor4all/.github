name: PR verification section

# Organization-wide, from this repository: an organization ruleset can require
# this workflow ("Require workflows to pass before merging"), so a target
# repository needs **no file of its own**. Verified against the API: a `workflows`
# rule pointing at tensor4all/.github rejects an unknown repository id and an
# unknown path, and is otherwise accepted on this organization's plan.
#
# `edited` is in the trigger list on purpose: without it, fixing the description
# after a failure leaves the check red, and deleting the evidence after a success
# leaves it green.

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  body:
    name: body
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          repository: tensor4all/.github
          path: org
          persist-credentials: false
      - name: Check the description against the template's contract
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: python3 org/scripts/check_pr_body.py
